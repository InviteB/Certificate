<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8ed2fa">
<title>Sertifikat Penghargaan · Best Senior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky-1:#8ed2fa; --sky-2:#c4e9fd; --sky-3:#eaf8ff;
  --navy:#12315f; --ink:#0b1f3f; --mid:#1c3f73;
  --gold:#e2b44f; --gold-deep:#b98424; --gold-soft:#f7e2a0;
  --rose:#c8203f;
  --ar:1.4143;
  --script:'Great Vibes','Brush Script MT','Segoe Script',cursive;
  --sans:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100dvh; overflow-x:hidden;
  font-family:var(--sans); color:var(--navy);
  background:
    radial-gradient(120% 70% at 50% -8%, #f6fdff 0%, rgba(246,253,255,0) 58%),
    linear-gradient(180deg,var(--sky-1) 0%, var(--sky-2) 48%, var(--sky-3) 100%);
  background-attachment:fixed;
}
body:not(.opened){overflow:hidden;height:100dvh}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ---------- Intro: the rose you tap ---------- */
.intro{
  position:fixed; inset:0; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(18px,3.5vh,30px); padding:24px; text-align:center;
  transition:opacity .5s ease .1s, visibility 0s linear .6s;
}
body.opened .intro{opacity:0;visibility:hidden;pointer-events:none}
.bud{
  position:relative; width:min(64vw,280px); aspect-ratio:1; padding:0; border:0; background:none;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
  transition:opacity .5s ease .5s;
}
body.opening .bud{opacity:0;pointer-events:none}
.bud svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 18px 22px rgba(120,10,40,.35));animation:breathe 3.6s ease-in-out infinite}
.bud::before{
  content:""; position:absolute; inset:-3%; border-radius:50%;
  border:1.5px solid var(--gold); opacity:0; animation:ping 2.8s ease-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.045) rotate(2deg)}}
@keyframes ping{0%{transform:scale(.86);opacity:.9}100%{transform:scale(1.22);opacity:0}}
.lay{transform-box:fill-box;transform-origin:center;transition:transform .95s cubic-bezier(.25,.7,.2,1),opacity .7s ease}
body.opening .bud .lay0{transform:scale(2.3) rotate(42deg);opacity:0}
body.opening .bud .lay1{transform:scale(2.1) rotate(-55deg);opacity:0;transition-delay:.06s}
body.opening .bud .lay2{transform:scale(1.9) rotate(60deg);opacity:0;transition-delay:.12s}
body.opening .bud .lay3{transform:scale(1.7) rotate(-70deg);opacity:0;transition-delay:.18s}
body.opening .bud .lay4{transform:scale(1.5);opacity:0;transition-delay:.24s}
.lead{margin:0;font-weight:600;font-size:clamp(18px,4.8vw,26px);line-height:1.35;max-width:22ch;color:var(--navy);transition:opacity .4s}
.hint{margin:-8px 0 0;font-size:clamp(13px,3.4vw,15px);color:var(--mid);transition:opacity .4s}
body.opening .lead,body.opening .hint{opacity:0}

/* ---------- Reveal ---------- */
.reveal{
  position:relative; z-index:3; min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(14px,3vh,28px);
  padding:clamp(24px,5vh,56px) 16px calc(28px + env(safe-area-inset-bottom));
  --cw:max(280px,min(92vw,920px,calc((100dvh - 340px) * 1.4143)));
}
.head{text-align:center;opacity:0;filter:blur(8px);transform:translateY(6px)}
body.opened .head{opacity:1;filter:none;transform:none;transition:opacity 1s ease .15s,filter 1s ease .15s,transform 1s ease .15s}
.head h1{
  margin:0; font-family:var(--script); font-weight:400;
  font-size:clamp(46px,12vw,88px); line-height:1.02; color:var(--navy);
  text-shadow:0 2px 0 rgba(255,255,255,.65),0 8px 24px rgba(255,255,255,.55);
}
.head h1:focus{outline:none}
.head p{margin:.6rem auto 0;max-width:36ch;font-weight:500;font-size:clamp(14px,3.7vw,17px);line-height:1.5;color:var(--mid)}

.cert-wrap{position:relative;width:var(--cw);perspective:1400px}
.cert-wrap::before{ /* light behind the certificate */
  content:""; position:absolute; left:50%; top:50%; width:150%; height:170%;
  transform:translate(-50%,-50%) scale(.6); opacity:0; pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,244,205,.95),rgba(255,244,205,.35) 55%,rgba(255,244,205,0) 100%);
}
.cert-wrap::after{ /* glow on the floor */
  content:""; position:absolute; left:50%; bottom:-7%; width:86%; height:9%;
  transform:translateX(-50%) scaleX(.4); opacity:0; pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));
  filter:blur(6px);
}
body.opened .cert-wrap::before{animation:lightIn 1.8s ease .6s forwards}
body.opened .cert-wrap::after{animation:floorIn 1.6s ease .9s forwards}
@keyframes lightIn{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes floorIn{to{transform:translateX(-50%) scaleX(1);opacity:.9}}

.tilt{
  position:relative; transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:transform .25s ease-out;
}
.cert-btn{
  display:block; width:100%; padding:0; border:0; background:none; cursor:zoom-in;
  -webkit-tap-highlight-color:transparent;
  opacity:0; transform:scale(.8); filter:blur(10px);
}
body.opened .cert-btn{opacity:1;transform:none;filter:none;transition:opacity 1s ease .7s,transform 1.4s cubic-bezier(.2,.9,.2,1) .7s,filter 1s ease .7s}
.frame{
  padding:clamp(4px,.9vw,8px); border-radius:clamp(10px,2vw,18px);
  background:linear-gradient(135deg,#f9e9b2,#d9a93f 42%,#f6dc92 68%,#b98424);
  box-shadow:0 34px 60px -24px rgba(18,49,95,.55),0 0 0 1px rgba(255,255,255,.6),0 0 70px rgba(255,226,150,.65);
}
.frame-in{position:relative;overflow:hidden;border-radius:clamp(7px,1.5vw,12px);line-height:0;aspect-ratio:var(--ar);background:#bfe6fc}
.frame-in img{width:100%;height:100%;display:block;object-fit:cover}
.frame-in::after{
  content:""; position:absolute; inset:0; transform:translateX(-120%); pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%);
}
body.opened .frame-in::after{animation:sweep 1.5s ease-out 2s forwards}
@keyframes sweep{to{transform:translateX(120%)}}

/* ---------- Roses ---------- */
.cluster{
  position:absolute; bottom:-9%; width:min(33%,320px); aspect-ratio:240/220; overflow:visible;
  pointer-events:none; filter:drop-shadow(0 8px 10px rgba(60,10,25,.3));
}
.cluster.l{left:-5%;transform:translateZ(46px)}
.cluster.r{right:-5%;transform:scaleX(-1) translateZ(46px)}
.leaf{transform-box:fill-box;transform-origin:0 50%;transform:scale(0)}
.bloom{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0) rotate(-55deg);opacity:0}
body.opened .leaf{animation:grow .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d) + 1.5s)}
body.opened .bloom{animation:bloom 1.15s cubic-bezier(.2,1.25,.3,1) forwards;animation-delay:calc(var(--d) + 1.75s)}
@keyframes grow{to{transform:scale(1)}}
@keyframes bloom{to{transform:scale(1) rotate(0);opacity:1}}

.caption{margin:-6px 0 0;font-size:13px;color:var(--mid);opacity:0}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;opacity:0;transform:translateY(8px)}
.again{opacity:0}
body.opened .caption{opacity:.85;transition:opacity .8s ease 2.4s}
body.opened .actions{opacity:1;transform:none;transition:opacity .8s ease 2.5s,transform .8s ease 2.5s}
body.opened .again{opacity:1;transition:opacity .8s ease 2.8s}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:50px;padding:0 24px;border-radius:999px;border:1px solid transparent;
  font-weight:600;font-size:15px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background-color .2s,box-shadow .2s;
}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--navy);color:#fff;box-shadow:0 10px 24px -10px rgba(18,49,95,.8)}
.btn.primary:hover{background:#0d2447}
.btn.ghost{background:rgba(255,255,255,.78);color:var(--navy);border-color:rgba(18,49,95,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.btn.ghost:hover{background:#fff}
.again{margin-top:-4px;background:none;border:0;padding:10px 14px;color:var(--mid);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* ---------- Canvas ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}

/* ---------- Fullscreen viewer ---------- */
.viewer{position:fixed;inset:0;z-index:20;background:#061226;cursor:zoom-out}
.viewer[hidden]{display:none}
.viewer img{
  position:absolute;left:50%;top:50%;height:auto;
  transform:translate(-50%,-50%);
  width:min(100vw,calc(100dvh * var(--ar)));
}
.viewer.rot img{transform:translate(-50%,-50%) rotate(90deg);width:min(100dvh,calc(100vw * var(--ar)))}
.viewer-close{
  position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));
  width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
  background:rgba(6,18,38,.6);color:#fff;display:grid;place-items:center;cursor:pointer;
}
.viewer-close:focus-visible{outline-color:#fff}
.viewer-close svg{width:22px;height:22px}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:30;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:500;
  transition:opacity .3s,transform .3s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .bud svg,.bud::before{animation:none!important}
  .bud::before{display:none}
}
</style>
</head>

  <img id="viewerImg" alt="Sertifikat penghargaan Best Senior untuk Kakak Kelas Diklat Gen 12">
  <button class="viewer-close" id="viewerClose" type="button" aria-label="Tutup">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a);

  /* ---------- Rose drawing ---------- */
  const petalPath = (R, w) =>
    `M0 0C${-w*.9} ${-R*.1} ${-w*1.12} ${-R*.82} ${-w*.32} ${-R*.98}Q0 ${-R*1.05} ${w*.32} ${-R*.98}C${w*1.12} ${-R*.82} ${w*.9} ${-R*.1} 0 0Z`;

  function roseInner() {
    const layers = [
      {n:6, R:44, w:20,   g:'rg0', off:0},
      {n:5, R:35, w:16,   g:'rg1', off:18},
      {n:5, R:26, w:12.5, g:'rg2', off:40},
      {n:4, R:18, w:9,    g:'rg3', off:12}
    ];
    let s = '';
    layers.forEach((L, i) => {
      let p = '';
      for (let k = 0; k < L.n; k++) {
        p += `<path d="${petalPath(L.R, L.w)}" transform="rotate(${L.off + k * 360 / L.n})"/>`;
      }
      s += `<g class="lay lay${i}" fill="url(#${L.g})" stroke="#6b0820" stroke-opacity=".38" stroke-width=".6" stroke-linejoin="round">${p}</g>`;
    });
    s += `<g class="lay lay4"><circle r="6.5" fill="url(#rg3)"/><path d="M-3.2 .2a3.2 3.2 0 1 1 6.4 0a5.2 5.2 0 1 1-10.4 0a7.2 7.2 0 1 1 14.4 0" fill="none" stroke="#5e0720" stroke-opacity=".7" stroke-width="1.1" stroke-linecap="round"/></g>`;
    return s;
  }

  const leafPath = L => `M0 0C${L*.25} ${-L*.2} ${L*.7} ${-L*.2} ${L} 0C${L*.7} ${L*.2} ${L*.25} ${L*.2} 0 0Z`;

  function cluster() {
    const leaves = [[-172,76],[-142,92],[-112,84],[-74,90],[-38,92],[-4,80],[30,62]];
    const roses = [ // x, y, scale, delay
      [128, 86, .62, .30],
      [165,150, .86, .12],
      [ 58,168, .78, .22],
      [100,128,1.12, 0]
    ];
    let s = `<svg viewBox="0 0 240 220" width="100%" height="100%" overflow="visible">`;
    leaves.forEach(([a, L], i) => {
      s += `<g transform="translate(110 150) rotate(${a})"><g class="leaf" style="--d:${(i*.07).toFixed(2)}s"><path d="${leafPath(L)}" fill="url(#lf)" stroke="#2c5a16" stroke-opacity=".4" stroke-width=".8"/><path d="M0 0L${L*.92} 0" stroke="#fff" stroke-opacity=".35" stroke-width="1" fill="none"/></g></g>`;
    });
    roses.forEach(([x, y, k, d]) => {
      s += `<g transform="translate(${x} ${y}) scale(${k})"><g class="bloom" style="--d:${d}s">${roseInner()}</g></g>`;
    });
    return s + `</svg>`;
  }

  $('#budSvg').innerHTML = roseInner();
  $('#clusterL').innerHTML = cluster();
  $('#clusterR').innerHTML = cluster();

  /* ---------- Particles: petals + gold sparkles ---------- */
  const fx = (() => {
    const c = $('#fx'), g = c.getContext('2d');
    let W = 0, H = 0, P = [], S = [], raf = 0, ambient = false, last = 0, spawnT = 0;
    const cols = ['#d8324f','#e85a73','#c21f3d','#f08fa1','#f9c3cd','#b3162f'];

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      c.width = W * dpr; c.height = H * dpr;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', resize); resize();

    const petal = (x, y, vx, vy, amb, big) => ({
      x, y, vx, vy, amb, fall: rnd(55, 95), dx: rnd(-18, 18),
      rot: rnd(0, 6.28), vr: rnd(-2, 2), flip: rnd(0, 6.28), vf: rnd(2, 5),
      sway: rnd(0, 6.28), size: rnd(6, big ? 13 : 10) * (W < 500 ? .85 : 1),
      col: cols[(Math.random() * cols.length) | 0]
    });
    const spark = (x, y, vx, vy, size, life, amb) => ({ x, y, vx, vy, size, life, t: 0, ph: rnd(0, 6.28), sp: rnd(1.4, 3), amb });

    function drawPetal(p) {
      const s = p.size;
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
      g.scale(1, .3 + .7 * Math.abs(Math.cos(p.flip)));
      g.fillStyle = p.col;
      g.beginPath();
      g.moveTo(0, -s);
      g.bezierCurveTo(s * .95, -s * .6, s * .8, s * .75, 0, s);
      g.bezierCurveTo(-s * .8, s * .75, -s * .95, -s * .6, 0, -s);
      g.fill(); g.restore();
    }
    function drawStar(x, y, s, a) {
      g.save(); g.translate(x, y); g.globalAlpha = Math.max(0, Math.min(1, a));
      g.fillStyle = '#ffe7a0';
      g.beginPath();
      g.moveTo(0, -s); g.quadraticCurveTo(s * .12, -s * .12, s, 0);
      g.quadraticCurveTo(s * .12, s * .12, 0, s);
      g.quadraticCurveTo(-s * .12, s * .12, -s, 0);
      g.quadraticCurveTo(-s * .12, -s * .12, 0, -s);
      g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(0, 0, s * .16, 0, 6.29); g.fill();
      g.restore();
    }

    function frame(t) {
      const dt = Math.min((t - last) / 1000 || .016, .05); last = t;
      g.clearRect(0, 0, W, H);

      if (ambient) {
        spawnT -= dt;
        if (spawnT <= 0) {
          spawnT = rnd(.5, 1.1);
          if (P.filter(p => p.amb).length < 14) P.push(petal(rnd(-20, W + 20), -20, rnd(-15, 15), rnd(30, 50), true));
        }
      }
      const k = 1 - Math.exp(-2 * dt);
      P = P.filter(p => p.y < H + 30);
      P.forEach(p => {
        p.vx += (p.dx - p.vx) * k; p.vy += (p.fall - p.vy) * k;
        p.sway += dt * 1.7;
        p.x += (p.vx + Math.sin(p.sway) * 22) * dt; p.y += p.vy * dt;
        p.rot += p.vr * dt; p.flip += p.vf * dt;
        drawPetal(p);
      });

      S = S.filter(s => s.amb || s.t < s.life);
      S.forEach(s => {
        s.t += dt;
        if (s.amb) {
          drawStar(s.x, s.y, s.size * (.6 + .4 * Math.sin(t / 1000 * s.sp + s.ph)), .5 + .5 * Math.sin(t / 1000 * s.sp + s.ph));
        } else {
          const d = Math.exp(-1.6 * dt); s.vx *= d; s.vy *= d;
          s.x += s.vx * dt; s.y += s.vy * dt;
          drawStar(s.x, s.y, s.size * (1 - s.t / s.life * .5), 1 - s.t / s.life);
        }
      });

      if (P.length || S.length || ambient) raf = requestAnimationFrame(frame);
      else { raf = 0; g.clearRect(0, 0, W, H); }
    }
    const start = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } };

    return {
      burst(cx, cy) {
        if (reduced) return;
        for (let i = 0; i < 70; i++) {
          const a = rnd(0, 6.283), sp = rnd(160, 560);
          P.push(petal(cx, cy, Math.cos(a) * sp, Math.sin(a) * sp - 90, false, true));
        }
        for (let i = 0; i < 46; i++) {
          const a = rnd(0, 6.283), sp = rnd(120, 520);
          S.push(spark(cx, cy, Math.cos(a) * sp, Math.sin(a) * sp - 60, rnd(4, 9), rnd(.9, 1.8), false));
        }
        start();
      },
      ambientOn() {
        if (reduced) return;
        ambient = true;
        for (let i = 0; i < 20; i++) S.push(spark(rnd(0, W), rnd(0, H), 0, 0, rnd(4, 8), 1, true));
        start();
      },
      stop() { ambient = false; S = S.filter(s => !s.amb); P = P.filter(p => !p.amb); }
    };
  })();

  /* ---------- Opening sequence ---------- */
  const body = document.body, intro = $('#intro'), reveal = $('#reveal'), openBtn = $('#openBtn');
  let state = 'closed';

  function open() {
    if (state !== 'closed') return;
    state = 'opening';
    body.classList.add('opening');
    const r = openBtn.getBoundingClientRect();
    fx.burst(r.left + r.width / 2, r.top + r.height / 2);
    intro.inert = true;
    setTimeout(() => {
      body.classList.add('opened');
      reveal.inert = false;
      state = 'open';
      fx.ambientOn();
      $('#title').focus({ preventScroll: true });
    }, reduced ? 0 : 900);
  }
  openBtn.addEventListener('click', open);

  $('#againBtn').addEventListener('click', () => {
    fx.stop();
    body.classList.remove('opened', 'opening');
    reveal.inert = true; intro.inert = false;
    state = 'closed';
    scrollTo(0, 0);
    openBtn.focus({ preventScroll: true });
  });

  /* ---------- Gentle tilt on desktop ---------- */
  if (!reduced && matchMedia('(hover:hover) and (pointer:fine)').matches) {
    const wrap = $('#wrap'), tilt = $('#tilt');
    addEventListener('pointermove', e => {
      if (state !== 'open' || !viewer.hidden) return;
      const r = wrap.getBoundingClientRect();
      const x = (e.clientX - (r.left + r.width / 2)) / innerWidth;
      const y = (e.clientY - (r.top + r.height / 2)) / innerHeight;
      tilt.style.setProperty('--ry', (x * 10).toFixed(2) + 'deg');
      tilt.style.setProperty('--rx', (-y * 8).toFixed(2) + 'deg');
    });
  }

  /* ---------- Fullscreen viewer ---------- */
  const viewer = $('#viewer'), viewerImg = $('#viewerImg'), certImg = $('#certImg'), certBtn = $('#certBtn');
  let lastTrigger = null;

  const setAR = () => { if (certImg.naturalWidth) document.documentElement.style.setProperty('--ar', (certImg.naturalWidth / certImg.naturalHeight).toFixed(4)); };
  certImg.complete ? setAR() : certImg.addEventListener('load', setAR);

  const layoutViewer = () => viewer.classList.toggle('rot', innerHeight > innerWidth);
  addEventListener('resize', () => { if (!viewer.hidden) layoutViewer(); });

  async function openViewer(trigger) {
    lastTrigger = trigger || certBtn;
    if (!viewerImg.src) viewerImg.src = certImg.src;
    viewer.hidden = false; layoutViewer();
    $('#viewerClose').focus({ preventScroll: true });
    try { if (viewer.requestFullscreen) await viewer.requestFullscreen({ navigationUI: 'hide' }); } catch (e) {}
    try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (e) {}
  }
  function closeViewer() {
    if (viewer.hidden) return;
    viewer.hidden = true;
    try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch (e) {}
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    if (lastTrigger) lastTrigger.focus({ preventScroll: true });
  }
  certBtn.addEventListener('click', () => openViewer(certBtn));
  $('#fullBtn').addEventListener('click', e => openViewer(e.currentTarget));
  viewer.addEventListener('click', closeViewer);
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) closeViewer(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') closeViewer(); });

  /* ---------- Save image ---------- */
  const toastEl = $('#toast'); let toastT;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }
  $('#saveBtn').addEventListener('click', async () => {
    try {
      const blob = await (await fetch(certImg.src)).blob();
      const name = 'Sertifikat-Best-Senior-Diklat-Gen-12.jpg';
      const file = new File([blob], name, { type: 'image/jpeg' });
      const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (iOS && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('Gambar tersimpan');
    } catch (e) {
      toast('Gambar belum bisa disimpan. Tahan gambar lalu pilih simpan.');
    }
  });
})();
</script>
</body>
</html>
